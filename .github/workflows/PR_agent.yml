name: PR Test Validation Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-validation:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Jest and React testing dependencies
        run: |
          npm init -y
          npm install --save-dev jest @testing-library/react @testing-library/jest-dom @testing-library/user-event jest-environment-jsdom @babel/preset-env @babel/preset-react babel-jest react react-dom

      - name: Configure Jest
        run: |
          cat > jest.config.js << 'EOF'
          module.exports = {
            testEnvironment: 'jsdom',
            roots: ['<rootDir>/testcase'],
            moduleDirectories: ['node_modules', 'coderep'],
            moduleNameMapper: {
              '\\.(css|less|scss|sass)$': '<rootDir>/__mocks__/styleMock.js',
              '\\.(jpg|jpeg|png|gif|svg)$': '<rootDir>/__mocks__/fileMock.js'
            },
            transform: {
              '^.+\\.(js|jsx|ts|tsx)$': 'babel-jest'
            },
            transformIgnorePatterns: ['/node_modules/'],
            testMatch: ['**/testcase/**/*.{test,spec}.{js,jsx,ts,tsx}']
          };
          EOF

          cat > babel.config.js << 'EOF'
          module.exports = {
            presets: [
              ['@babel/preset-env', { targets: { node: 'current' } }],
              ['@babel/preset-react', { runtime: 'automatic' }]
            ]
          };
          EOF

          mkdir -p __mocks__
          echo "module.exports = {};" > __mocks__/styleMock.js
          echo "module.exports = 'test-file-stub';" > __mocks__/fileMock.js

      - name: Run Jest tests
        id: jest
        continue-on-error: true
        run: |
          npx jest --json --outputFile=jest-results.json --forceExit 2>&1 | tee jest-output.log || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate and report
        id: validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Read jest results from actual test run
            let jestJson = '{}';
            try {
              jestJson = fs.readFileSync('jest-results.json', 'utf-8');
            } catch (e) {
              jestJson = JSON.stringify({ error: "Jest did not produce results", numTotalTests: 0, numPassedTests: 0, numFailedTests: 0, testResults: [] });
            }

            // Find committed test and code files
            let testFiles = [];
            let codeFiles = [];
            try {
              testFiles = execSync('find testcase -type f -name "*.test.*" -o -name "*.spec.*" 2>/dev/null || true', { encoding: 'utf-8' }).trim().split('\n').filter(Boolean);
            } catch(e) {}
            try {
              codeFiles = execSync('find coderep -type f \\( -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" \\) 2>/dev/null || true', { encoding: 'utf-8' }).trim().split('\n').filter(Boolean);
            } catch(e) {}

            // Read actual file contents from the committed repo
            const testContents = {};
            for (const f of testFiles) {
              try { testContents[f] = fs.readFileSync(f, 'utf-8'); } catch(e) {}
            }
            const codeContents = {};
            for (const f of codeFiles) {
              try { codeContents[f] = fs.readFileSync(f, 'utf-8'); } catch(e) {}
            }

            // Write temp data for Python script
            fs.writeFileSync('/tmp/jest_results.json', jestJson);
            fs.writeFileSync('/tmp/file_lists.json', JSON.stringify({
              test_files: testFiles,
              code_files: codeFiles,
              test_contents: testContents,
              code_contents: codeContents
            }));

            // Run Python report generator — returns JSON with markdown report, HTML report, and pass/fail
            const resultRaw = execSync(
              `python -c "
            import json, sys
            sys.path.insert(0, '.')
            from app.report import parse_jest_results, find_missing_coverage, generate_test_report
            from app.report_html import generate_html_report

            with open('/tmp/jest_results.json') as f:
                jest_raw = f.read()

            with open('/tmp/file_lists.json') as f:
                files = json.load(f)

            jest_results = parse_jest_results(jest_raw)
            missing = find_missing_coverage(
                files['test_files'],
                files['code_files'],
                test_contents=files.get('test_contents', {}),
                code_contents=files.get('code_contents', {})
            )
            report = generate_test_report(jest_results, missing)
            html_report = generate_html_report(jest_results, missing)

            with open('/tmp/report.html', 'w') as f:
                f.write(html_report)

            passed = jest_results.get('failed', 0) == 0
            print(json.dumps({
                'report': report,
                'passed': passed,
                'failed_count': jest_results.get('failed', 0),
                'missing_count': len(missing)
            }))
            "`,
              { encoding: 'utf-8' }
            );

            const result = JSON.parse(resultRaw.trim());
            const report = result.report;
            const passed = result.passed;
            const htmlReport = fs.readFileSync('/tmp/report.html', 'utf-8');

            // Dismiss previous bot reviews so only the latest state matters
            const reviews = await github.rest.pulls.listReviews({ owner, repo, pull_number: prNumber });
            for (const review of reviews.data) {
              if (review.user.login === 'github-actions[bot]' && review.state !== 'DISMISSED') {
                try {
                  await github.rest.pulls.dismissReview({
                    owner, repo, pull_number: prNumber,
                    review_id: review.id,
                    message: 'Superseded by new validation run'
                  });
                } catch(e) {}
              }
            }

            if (passed) {
              // APPROVE — enables merge
              await github.rest.pulls.createReview({
                owner, repo, pull_number: prNumber,
                event: 'APPROVE',
                body: `## ✅ Test Validation Passed\n\n${htmlReport}\n\n---\n_All committed tests pass. Merge is allowed._`
              });
            } else {
              // REQUEST_CHANGES — blocks merge button
              await github.rest.pulls.createReview({
                owner, repo, pull_number: prNumber,
                event: 'REQUEST_CHANGES',
                body: `## ❌ Test Validation Failed\n\n${htmlReport}\n\n### Suggested Changes\nPlease fix the failing tests listed above before merging.\n\n---\n_Merge is blocked until all committed tests pass. Push fixes and the agent will re-validate automatically._`
              });

              // Fail the check so branch protection blocks merge
              core.setFailed(`Validation failed: ${result.failed_count} test(s) failed`);
            }

      - name: Save HTML report
        if: always()
        run: |
          mkdir -p dist
          cp /tmp/report.html dist/index.html

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-validation-report
          path: dist/index.html

      - name: Deploy report to Netlify
        if: always()
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify-cli deploy --prod --dir=dist --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN
