name: PR Test Validation Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-validation:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Jest and React testing dependencies
        run: |
          npm init -y
          npm install --save-dev jest @testing-library/react @testing-library/jest-dom @testing-library/user-event jest-environment-jsdom @babel/preset-env @babel/preset-react babel-jest react react-dom

      - name: Configure Jest
        run: |
          cat > jest.config.js << 'EOF'
          module.exports = {
            testEnvironment: 'jsdom',
            roots: ['<rootDir>/testcase'],
            moduleDirectories: ['node_modules', 'coderep'],
            moduleNameMapper: {
              '\\.(css|less|scss|sass)$': '<rootDir>/__mocks__/styleMock.js',
              '\\.(jpg|jpeg|png|gif|svg)$': '<rootDir>/__mocks__/fileMock.js'
            },
            transform: {
              '^.+\\.(js|jsx|ts|tsx)$': 'babel-jest'
            },
            transformIgnorePatterns: ['/node_modules/'],
            testMatch: ['**/testcase/**/*.{test,spec}.{js,jsx,ts,tsx}']
          };
          EOF

          cat > babel.config.js << 'EOF'
          module.exports = {
            presets: [
              ['@babel/preset-env', { targets: { node: 'current' } }],
              ['@babel/preset-react', { runtime: 'automatic' }]
            ]
          };
          EOF

          mkdir -p __mocks__
          echo "module.exports = {};" > __mocks__/styleMock.js
          echo "module.exports = 'test-file-stub';" > __mocks__/fileMock.js

      - name: Run Jest tests
        id: jest
        continue-on-error: true
        run: |
          npx jest --json --outputFile=jest-results.json --forceExit 2>&1 | tee jest-output.log || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate validation report
        id: validate
        run: |
          python -c "
          import json, sys
          sys.path.insert(0, '.')
          from app.report import parse_jest_results, find_missing_coverage, generate_test_report
          from app.report_html import generate_html_report
          import subprocess

          # Read jest results
          try:
              with open('jest-results.json') as f:
                  jest_raw = f.read()
          except FileNotFoundError:
              jest_raw = json.dumps({'numTotalTests': 0, 'numPassedTests': 0, 'numFailedTests': 0, 'testResults': []})

          # Find test and code files
          import os, re
          test_files = []
          code_files = []
          for root, dirs, files in os.walk('testcase'):
              for f in files:
                  if re.search(r'\.(test|spec)\.(js|jsx|ts|tsx)$', f):
                      test_files.append(os.path.join(root, f))
          for root, dirs, files in os.walk('coderep'):
              for f in files:
                  if re.search(r'\.(js|jsx|ts|tsx)$', f):
                      code_files.append(os.path.join(root, f))

          # Read file contents
          test_contents = {}
          for f in test_files:
              try:
                  with open(f) as fh: test_contents[f] = fh.read()
              except: pass
          code_contents = {}
          for f in code_files:
              try:
                  with open(f) as fh: code_contents[f] = fh.read()
              except: pass

          jest_results = parse_jest_results(jest_raw)
          missing = find_missing_coverage(test_files, code_files, test_contents=test_contents, code_contents=code_contents)
          html_report = generate_html_report(jest_results, missing)

          os.makedirs('dist', exist_ok=True)
          with open('dist/index.html', 'w') as f:
              f.write(html_report)

          passed = jest_results.get('failed', 0) == 0
          result = {'passed': passed, 'failed_count': jest_results.get('failed', 0), 'missing_count': len(missing)}
          with open('/tmp/validation_result.json', 'w') as f:
              json.dump(result, f)

          # Set output for later steps
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f\"passed={'true' if passed else 'false'}\n\")
              fh.write(f\"failed_count={result['failed_count']}\n\")
              fh.write(f\"missing_count={result['missing_count']}\n\")
          "

      - name: Deploy report to Netlify
        id: deploy
        if: always()
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          mkdir -p dist
          DEPLOY_OUTPUT=$(npx netlify-cli deploy --prod --dir=dist --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN 2>&1)
          echo "$DEPLOY_OUTPUT"
          DASHBOARD_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'Website URL:\s*\K(https://[^\s]+)' || echo "https://${NETLIFY_SITE_ID}.netlify.app")
          echo "dashboard_url=$DASHBOARD_URL" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const passed = '${{ steps.validate.outputs.passed }}' === 'true';
            const failedCount = '${{ steps.validate.outputs.failed_count }}';
            const missingCount = '${{ steps.validate.outputs.missing_count }}';
            const dashboardUrl = '${{ steps.deploy.outputs.dashboard_url }}';

            // Delete previous bot comments to keep PR clean
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber });
            for (const comment of comments.data) {
              if (comment.user.login === 'github-actions[bot]' && comment.body.includes('Test Validation')) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });
              }
            }

            let body;
            if (passed) {
              body = `## ✅ Test Validation Passed\n\nAll committed tests pass. Merge is allowed.\n\n📊 [View Full Dashboard](${dashboardUrl})`;
            } else {
              body = `## ❌ Test Validation Failed\n\n| Metric | Count |\n|--------|-------|\n| Failed Tests | ${failedCount} |\n| Missing Coverage | ${missingCount} |\n\n### 📊 [View Error Details on Dashboard](${dashboardUrl})\n\nPlease fix the failing tests before merging.\n\n---\n_Merge is blocked until all committed tests pass. Push fixes and the agent will re-validate automatically._`;
            }

            await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });

            if (!passed) {
              core.setFailed(`Validation failed: ${failedCount} test(s) failed`);
            }

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-validation-report
          path: dist/index.html
